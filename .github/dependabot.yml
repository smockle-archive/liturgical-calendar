version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
    groups:
      # Keep the Romcal packages in one PR because their prerelease versions
      # need to stay aligned and Dependabot classifies them as separate majors.
      romcal:
        applies-to: version-updates
        patterns:
          - "romcal"
          - "@romcal/calendar.general-roman"
          - "@romcal/calendar.united-states"
      # Open PRs for each major version and security update
      # Open an aggregate PR for all minor and patch version updates
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    groups:
      # Open an aggregate PR for all GitHub Actions updates
      github-actions:
        patterns:
          - "*"
    schedule:
      interval: "weekly"
